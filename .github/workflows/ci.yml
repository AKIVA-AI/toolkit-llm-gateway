name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gateway_user
          POSTGRES_PASSWORD: gateway_test
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run config validator
      run: |
        cd src
        python -m toolkit_extensions.config_validator --no-exit
      env:
        DATABASE_URL: postgresql://gateway_user:gateway_test@localhost:5432/gateway_test

    - name: Run tests
      run: |
        pytest --cov=toolkit_extensions --cov-report=xml --cov-report=term
      env:
        DATABASE_URL: postgresql://gateway_user:gateway_test@localhost:5432/gateway_test

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy

    - name: Run Black
      run: black --check src/toolkit_extensions tests

    - name: Run Ruff
      run: ruff check src/toolkit_extensions tests

    - name: Run MyPy
      run: mypy src/toolkit_extensions --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run Safety check
      run: safety check --json

    - name: Run Bandit
      run: bandit -r src/toolkit_extensions -f json -o bandit-report.json

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM (CycloneDX)
      run: syft dir:. -o cyclonedx-json=sbom.cdx.json

    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Scan SBOM for vulnerabilities
      run: grype sbom:sbom.cdx.json --fail-on critical

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sbom
        path: sbom.cdx.json

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, security, sbom]
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: toolkit-llm-gateway:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  all-checks:
    name: All Checks
    if: always()
    needs: [test, lint, security, sbom, build]
    runs-on: ubuntu-latest
    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All checks passed"
